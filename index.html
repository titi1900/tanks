<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030508">
<title>Bunker Tanks 3D - Édition Three.js WebGL</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* ===== RÉINITIALISATION ===== */
html,body{height:100%;margin:0;background:#030508;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;font-family:"Press Start 2P",ui-monospace,monospace;color:#ffcc66}

/* ===== RENDU WEBGL ===== */
#view{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Vignette + scanlines rétro */
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center, transparent 40%, rgba(0,5,15,0.85) 100%), linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%);background-size:100% 100%, 100% 4px;z-index:1}

/* ===== CANON FPS (overlay CSS, caméra Three.js en dessous) ===== */
#gun-container{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:500px;height:300px;pointer-events:none;z-index:2;perspective:600px}
#gun-body{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .06s ease-out}
#gun-body.recoil{transform:translateZ(-50px) rotateX(6deg) translateY(18px)}
.tank-turret-top{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:460px;height:70px;background:linear-gradient(180deg,#7a8280 0%,#505856 50%,#353b3a 100%);border-radius:15px 15px 0 0;box-shadow:inset 0 3px 6px rgba(255,255,255,0.3),0 -10px 25px rgba(0,0,0,0.8);border-top:2px solid #9aa2a0}
/* Jeu de canons : 3 emplacements, affichés selon l'arme (classes wp1/wp2/wp3 sur <body>) */
.barrel-set{position:absolute;left:50%;bottom:0;width:240px;height:300px;transform:translateX(calc(-50% + var(--bx,0px)));display:none}
.barrel-set[data-b="1"]{--bx:-52px}
.barrel-set[data-b="2"]{--bx:52px}
body:not(.wp2):not(.wp3) .barrel-set[data-b="0"]{display:block}
body.wp2 .barrel-set[data-b="1"],body.wp2 .barrel-set[data-b="2"]{display:block}
body.wp3 .barrel-set{display:block}
.perspective-barrel{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);width:240px;height:170px;background:linear-gradient(90deg,#1c2220 0%,#505856 25%,#7a8280 50%,#404846 75%,#181c1a 100%);clip-path:polygon(32% 0%,68% 0%,100% 100%,0% 100%)}
.barrel-back-ellipse{position:absolute;left:50%;bottom:228px;transform:translateX(-50%);width:76px;height:24px;background:linear-gradient(180deg,#353b3a,#181c1a);border-radius:50%;border:2px solid #68706e}
.barrel-muzzle{position:absolute;left:50%;bottom:240px;transform:translateX(-50%);width:44px;height:16px;background:radial-gradient(ellipse at center,#050505 50%,#353b3a 100%);border-radius:50%;border:2px solid #858d8b}
.mf{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#ffffff 0%,#ffee55 30%,#ff4400 60%,transparent 75%);box-shadow:0 0 60px #ff4400;display:none;z-index:4}
#gun-body.recoil .mf{display:block}
.det #gun-container,.det #cross{display:none}
.tps #gun-container,.tps #cross{display:none}
.tps #tools [data-a="view"],.det #tools [data-a="view"]{background:#00ccaa;color:#000;border-color:#00ccaa;box-shadow:0 0 10px #00ccaa}

/* ===== VITAUX DU JOUEUR : barres PV / ARMURE ===== */
#vitals{position:fixed;left:16px;bottom:max(20px,env(safe-area-inset-bottom));width:min(240px,44vw);z-index:3;pointer-events:none;font-size:9px;text-shadow:1px 1px 2px #000}
#vitals .vrow{margin-top:5px}
#vitals .bar{position:relative;height:12px;border:2px solid rgba(255,204,102,.6);background:rgba(0,0,0,.6);margin-top:3px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
#vitals .bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
#hpfill{background:linear-gradient(90deg,#22cc44,#88ee44);transition:width .15s,background .3s}
#arfill{background:linear-gradient(90deg,#2266cc,#44aaee);transition:width .15s}
/* Flash lumineux quand une caisse Réparation/Blindage est ramassée */
#vitals .bar.fx{animation:barfx .45s ease-out}
@keyframes barfx{0%{box-shadow:0 0 18px #ffffff,0 0 30px #88ff88;border-color:#fff}100%{box-shadow:0 2px 6px rgba(0,0,0,.6)}}

/* ===== HUD ===== */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;font-size:11px;line-height:1.6;text-shadow:2px 2px 4px #000;pointer-events:none;z-index:3}
#hl,#hr{white-space:pre}#hr{text-align:right}

#bossbar{position:fixed;left:20%;right:20%;top:calc(env(safe-area-inset-top,0px) + 55px);height:14px;border:2px solid #ffcc66;background:rgba(30,0,0,0.8);display:none;pointer-events:none;z-index:3;box-shadow:0 0 10px #ff0000}
#bb{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff1100,#ff6600);transition:width .1s}

#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none;z-index:3}
#cross::before,#cross::after{content:'';position:absolute;background:#00ffcc;box-shadow:0 0 5px #00ffcc}
#cross::before{left:9px;top:0;width:2px;height:20px}
#cross::after{left:0;top:9px;width:20px;height:2px}

#flash{position:fixed;inset:0;background:#ff0000;opacity:0;pointer-events:none;z-index:2;transition:opacity .1s}
#toast{position:fixed;left:0;right:0;top:25%;text-align:center;font-size:14px;color:#fff;text-shadow:0 0 10px #ffaa00,2px 2px #000;pointer-events:none;opacity:0;z-index:4;transition:opacity .2s}

/* Mini-carte 2D (conservée en Canvas 2D) */
#map{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);pointer-events:none;border:2px solid rgba(255,204,102,0.5);background:rgba(3,5,8,0.85);z-index:3;box-shadow:0 0 15px rgba(0,0,0,0.8)}
#map.big{right:auto;top:50%;left:50%;transform:translate(-50%,-50%);border-width:3px}

/* Barre d'outils */
#tools{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;z-index:5}
#tools button{font:inherit;font-size:8px;padding:6px 10px;background:rgba(20,10,10,0.85);color:#ffcc66;border:2px solid rgba(255,204,102,0.4);cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,0.5)}
#tools button.on{background:#ff4d2d;color:#000;border-color:#ff4d2d;box-shadow:0 0 10px #ff4d2d}
#tools .z{display:none}.det #tools .z{display:block}

/* Commandes tactiles */
#tz{position:fixed;inset:0;z-index:2;touch-action:none}
#stick{position:fixed;width:100px;height:100px;margin:-50px 0 0 -50px;border:2px solid rgba(255,204,102,0.4);border-radius:50%;display:none;z-index:4;pointer-events:none;background:rgba(0,0,0,0.2)}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:rgba(255,204,102,0.6);box-shadow:0 0 10px #ffcc66}
#fire{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;border:3px solid #ff4d2d;background:rgba(255,77,45,0.3);color:#fff;font:inherit;font-size:12px;display:none;z-index:5}
@media (pointer:coarse){#fire{display:block}}

/* ===== MENU ===== */
#menu{position:fixed;inset:0;z-index:6;background:rgba(3,5,8,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px;backdrop-filter:blur(5px)}
#menu h1{margin:0;font-size:clamp(22px,6vw,40px);color:#ff4d2d;text-shadow:0 0 15px rgba(255,77,45,0.6),3px 3px #000}
#menu p{margin:0;font-size:10px;line-height:1.8;max-width:560px;color:#d0d8e0}
#sk{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#sk button{font:inherit;font-size:9px;padding:10px 12px;background:#100a0a;color:#ffcc66;border:2px solid rgba(255,204,102,0.3);cursor:pointer}
#sk button.on{background:#ff4d2d;color:#000;border-color:#ff4d2d;box-shadow:0 0 10px #ff4d2d}
#go{font:inherit;font-size:16px;padding:16px 36px;background:#3a0d0d;color:#ffcc66;border:3px solid #ff4d2d;cursor:pointer;box-shadow:0 0 15px rgba(255,77,45,0.4)}
</style>
</head>
<body>

<div id="view"><canvas id="gl"></canvas></div>
<div id="vig"></div>

<div id="gun-container">
  <div id="gun-body">
    <div class="tank-turret-top"></div>
    <div class="barrel-set" data-b="0"><div class="barrel-muzzle"></div><div class="barrel-back-ellipse"></div><div class="perspective-barrel"></div><div class="mf"></div></div>
    <div class="barrel-set" data-b="1"><div class="barrel-muzzle"></div><div class="barrel-back-ellipse"></div><div class="perspective-barrel"></div><div class="mf"></div></div>
    <div class="barrel-set" data-b="2"><div class="barrel-muzzle"></div><div class="barrel-back-ellipse"></div><div class="perspective-barrel"></div><div class="mf"></div></div>
  </div>
</div>

<canvas id="map"></canvas>

<div id="hud"><span id="hl"></span><span id="hr"></span></div>
<div id="bossbar"><i id="bb"></i></div>

<!-- Barres de vie et armure du joueur -->
<div id="vitals">
  <div class="vrow">PV <span id="hptxt">100</span> · CANON <span id="wptxt">x1</span></div>
  <div class="bar" id="hpbar"><i id="hpfill"></i></div>
  <div class="vrow">ARMURE <span id="artxt">0</span></div>
  <div class="bar" id="arbar"><i id="arfill"></i></div>
</div>
<div id="cross"></div>
<div id="flash"></div>
<div id="toast"></div>

<div id="tools">
  <button data-a="map">CARTE</button>
  <button data-a="fol">SUIVI</button>
  <button data-a="cam">CAM</button>
  <button data-a="view">VUE</button>
  <button data-a="zoom">ZOOM</button>
  <button data-a="fs">PLEIN</button>
  <button class="z" data-a="in">+</button>
  <button class="z" data-a="out">−</button>
</div>

<div id="tz"></div>
<div id="stick"><i id="knob"></i></div>
<button id="fire">TIR</button>

<div id="menu">
  <h1>BUNKER TANKS 3D</h1>
  <p>Détruisez le Boss pour réussir ! Rendu WebGL Three.js. Touche C ou bouton VUE : bascule vue FPS / 3e personne.</p>
  <div id="sk"></div>
  <button id="go">JOUER</button>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ===== CONSTANTES =====
const S=4;                       // taille d'une cellule (unités monde Three.js)
const WALL_H=4;                  // hauteur des murs
const coarse=matchMedia('(pointer:coarse)').matches;
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

// Difficultés / ennemis / armes / loots / couleurs de murs
const SK=[{n:'Recrue',d:.5,h:.7,s:.8},{n:'Soldat',d:.75,h:.85,s:.9},{n:'Vétéran',d:1,h:1,s:1},{n:'Ultra',d:1.4,h:1.2,s:1.15},{n:'Cauchemar',d:1.8,h:1.5,s:1.3}];
const TY={emp:{hp:45,sp:1.3,r:.42},grunt:{hp:70,sp:1.0,r:.38},boss:{hp:380,sp:.8,r:.65}};
const WP=[0,{cd:.38,pel:1,sp:.01,dmg:25},{cd:.65,pel:2,sp:.04,dmg:20},{cd:.12,pel:1,sp:.03,dmg:14}];
const LOOT='HHHAAARWQBT';
// ==========================================================================
// THÈMES DE DÉCOR : chaque chambre du labyrinthe possède ses propres
// textures de murs et son propre motif de sol. Index 0 = couloirs.
// ==========================================================================
const THEMES=[
{n:'Couloir béton',c:0x6a7482,
 w(x,s){x.fillStyle='#59626f';x.fillRect(0,0,s,s);
  for(let i=0;i<90;i++){x.fillStyle=Math.random()<.5?'rgba(0,0,0,0.18)':'rgba(255,255,255,0.07)';x.fillRect(rnd(0,s),rnd(0,s),rnd(2,5),rnd(2,5))}
  x.fillStyle='rgba(0,0,0,0.45)';x.fillRect(0,s*.48,s,3);
  x.strokeStyle='rgba(0,0,0,0.35)';x.lineWidth=2;
  x.beginPath();x.moveTo(10,4);x.lineTo(18,30);x.lineTo(12,60);x.stroke();
  x.lineWidth=3;x.strokeRect(1,1,s-2,s-2)},
 f(x,s){x.fillStyle='#3f4238';x.fillRect(0,0,s,s);
  for(let i=0;i<40;i++){x.fillStyle='rgba(0,0,0,0.15)';x.fillRect(rnd(0,s),rnd(0,s),rnd(2,4),rnd(2,4))}}},
{n:'Banquise',c:0x7ab0d8,
 w(x,s){x.fillStyle='#9cc8e8';x.fillRect(0,0,s,s);
  x.fillStyle='rgba(255,255,255,0.5)';for(let i=0;i<5;i++)x.fillRect(rnd(0,s),i*s/5+2,s*.4,3);
  x.strokeStyle='rgba(60,110,160,0.6)';x.lineWidth=2;
  x.beginPath();x.moveTo(s*.2,0);x.lineTo(s*.5,s*.4);x.lineTo(s*.3,s);x.stroke();
  x.beginPath();x.moveTo(s*.8,0);x.lineTo(s*.6,s*.6);x.lineTo(s*.85,s);x.stroke();
  x.fillStyle='rgba(140,200,255,0.4)';x.fillRect(0,s*.45,s,4)},
 f(x,s){x.fillStyle='#b8d8ec';x.fillRect(0,0,s,s);
  x.strokeStyle='rgba(120,170,210,0.7)';x.lineWidth=1;
  for(let i=0;i<3;i++){x.beginPath();x.moveTo(rnd(0,s),0);x.lineTo(rnd(0,s),s);x.stroke()}
  x.fillStyle='rgba(255,255,255,0.7)';x.fillRect(rnd(0,s-8),rnd(0,s-4),8,3)}},
{n:'Fournaise volcanique',c:0x5a4038,
 w(x,s){x.fillStyle='#2a2020';x.fillRect(0,0,s,s);
  for(let i=0;i<50;i++){x.fillStyle=Math.random()<.5?'rgba(60,40,35,0.6)':'rgba(20,12,10,0.6)';x.beginPath();x.arc(rnd(0,s),rnd(0,s),rnd(4,12),0,7);x.fill()}
  x.strokeStyle='rgba(255,120,20,0.9)';x.lineWidth=3;
  x.beginPath();x.moveTo(0,s*.8);x.lineTo(s*.3,s*.6);x.lineTo(s*.5,s*.75);x.lineTo(s*.8,s*.4);x.lineTo(s,s*.5);x.stroke();
  x.strokeStyle='rgba(255,220,80,0.9)';x.lineWidth=1;
  x.beginPath();x.moveTo(0,s*.8);x.lineTo(s*.3,s*.6);x.lineTo(s*.5,s*.75);x.lineTo(s*.8,s*.4);x.lineTo(s,s*.5);x.stroke()},
 f(x,s){x.fillStyle='#241816';x.fillRect(0,0,s,s);
  for(let i=0;i<12;i++){x.fillStyle='rgba(255,100,20,0.8)';x.fillRect(rnd(0,s),rnd(0,s),2,2)}
  x.strokeStyle='rgba(255,60,10,0.35)';x.lineWidth=1;
  x.beginPath();x.moveTo(0,s*.6);x.lineTo(s*.4,s*.5);x.lineTo(s,s*.7);x.stroke()}},
{n:'Forêt moussue',c:0x4a6a3a,
 w(x,s){x.fillStyle='#5c5a50';x.fillRect(0,0,s,s);
  for(let i=0;i<8;i++){x.fillStyle=Math.random()<.6?'rgba(70,120,50,0.55)':'rgba(50,90,40,0.55)';x.beginPath();x.arc(rnd(0,s),rnd(0,s),rnd(8,20),0,7);x.fill()}
  x.strokeStyle='rgba(0,0,0,0.35)';x.lineWidth=3;
  x.strokeRect(2,2,s-4,s-4);x.beginPath();x.moveTo(s/2,0);x.lineTo(s/2,s);x.stroke();
  x.fillStyle='rgba(140,220,90,0.5)';for(let i=0;i<6;i++)x.fillRect(rnd(0,s),rnd(0,s),2,2)},
 f(x,s){x.fillStyle='#3a5a2c';x.fillRect(0,0,s,s);
  for(let i=0;i<20;i++){x.fillStyle=Math.random()<.5?'rgba(20,60,20,0.5)':'rgba(120,200,80,0.4)';x.fillRect(rnd(0,s),rnd(0,s),2,3)}
  x.strokeStyle='rgba(150,230,110,0.5)';x.lineWidth=1;
  for(let i=0;i<3;i++){x.beginPath();x.moveTo(rnd(0,s),s);x.quadraticCurveTo(rnd(0,s),rnd(0,s*.5),rnd(0,s),0);x.stroke()}}},
{n:'Temple ancien',c:0xc0a060,
 w(x,s){x.fillStyle='#c8a870';x.fillRect(0,0,s,s);
  for(let i=0;i<40;i++){x.fillStyle='rgba(90,70,40,0.15)';x.fillRect(rnd(0,s),rnd(0,s),3,3)}
  x.strokeStyle='rgba(120,90,40,0.7)';x.lineWidth=2;
  for(let r=0;r<4;r++){const off=r%2?s/8:0;
    x.strokeRect(-s/8+off,r*s/4+3,s/4-4,s/4-6);x.strokeRect(s/8+off,r*s/4+3,s/4-4,s/4-6)}
  x.strokeStyle='rgba(90,55,20,0.8)';
  x.beginPath();x.moveTo(s*.2,s*.8);x.lineTo(s*.2,s*.6);x.lineTo(s*.3,s*.7);x.moveTo(s*.35,s*.8);x.lineTo(s*.35,s*.6);x.stroke();
  x.fillStyle='rgba(220,180,90,0.6)';x.fillRect(0,0,s,5)},
 f(x,s){x.fillStyle='#b09858';x.fillRect(0,0,s,s);
  x.strokeStyle='rgba(90,70,30,0.5)';x.lineWidth=2;
  x.strokeRect(2,2,s-4,s-4);
  x.beginPath();x.arc(s/2,s/2,s*.3,0,7);x.stroke();
  x.strokeStyle='rgba(90,55,20,0.6)';
  x.beginPath();x.moveTo(s/2,s*.2);x.lineTo(s/2,s*.8);x.moveTo(s*.2,s/2);x.lineTo(s*.8,s/2);x.stroke();
  x.fillStyle='rgba(255,230,150,0.4)';x.fillRect(s/2-2,s/2-2,4,4)}},
{n:'Cyber néon',c:0x8040a8,
 w(x,s){x.fillStyle='#12081e';x.fillRect(0,0,s,s);
  x.strokeStyle='rgba(255,40,180,0.85)';x.lineWidth=3;
  x.beginPath();x.moveTo(0,s*.3);x.lineTo(s*.3,s*.3);x.lineTo(s*.3,s*.7);x.lineTo(s,s*.7);x.stroke();
  x.beginPath();x.moveTo(0,s*.75);x.lineTo(s*.6,s*.75);x.stroke();
  x.strokeStyle='rgba(40,220,255,0.8)';x.lineWidth=1;
  x.beginPath();x.moveTo(0,s*.3);x.lineTo(s*.3,s*.3);x.lineTo(s*.3,s*.7);x.lineTo(s,s*.7);x.stroke();
  x.fillStyle='#40eaff';
  for(let i=0;i<4;i++)x.fillRect(rnd(4,s-8),rnd(4,s-8),3,3);
  x.fillStyle='rgba(255,40,180,0.5)';x.fillRect(0,0,s,3)},
 f(x,s){x.fillStyle='#0c0616';x.fillRect(0,0,s,s);
  x.strokeStyle='rgba(40,220,255,0.3)';x.lineWidth=1;
  for(let i=3;i<s;i+=4){x.beginPath();x.moveTo(i,0);x.lineTo(i,s);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(s,i);x.stroke()}
  x.fillStyle='rgba(255,40,180,0.7)';x.fillRect(s/2-2,0,4,2);x.fillRect(0,s/2-2,2,4);
  x.fillStyle='rgba(40,220,255,0.4)';x.fillRect(s-3,s-3,2,2)}},
{n:'Entrepôt',c:0x8a6a4a,
 w(x,s){x.fillStyle='#6a4a30';x.fillRect(0,0,s,s);
  x.fillStyle='rgba(255,255,255,0.06)';for(let i=0;i<s;i+=12)x.fillRect(i,0,6,s);
  x.strokeStyle='rgba(0,0,0,0.5)';x.lineWidth=4;x.strokeRect(2,2,s-4,s-4);
  x.fillStyle='#d8b040';x.fillRect(s*.35,s*.35,s*.3,s*.08);
  x.fillStyle='rgba(0,0,0,0.4)';x.font='bold 12px monospace';x.fillText(String.fromCharCode(48+(Math.random()*9|0)),s*.45,s*.55);
  x.fillStyle='rgba(255,255,255,0.08)';x.fillRect(0,0,s,4)},
 f(x,s){x.fillStyle='#565048';x.fillRect(0,0,s,s);

function canvasTex(w,h,draw){

  draw(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c);return t;
}

  x.fillStyle=g;x.fillRect(0,0,128,128);
});

});
function trackTexture(){
  return canvasTex(64,64,x=>{
    x.fillStyle='#222';x.fillRect(0,0,64,64);
    x.fillStyle='#444';for(let i=0;i<64;i+=16)x.fillRect(0,i,64,6);

}
// Texture du sol : chaque cellule est dessinée avec le motif du thème de sa zone
function floorTexture(){
  const T=16,c=document.createElement('canvas');c.width=MW*T;c.height=MH*T;const x=c.getContext('2d');
  for(let j=0;j<MH;j++)for(let i=0;i<MW;i++){
    const l=LT[j*MW+i],th=THEMES[TG[j*MW+i]]||THEMES[0];
    x.save();x.translate(i*T,j*T);th.f(x,T);x.restore();
    if(l<.9){x.fillStyle=`rgba(0,0,0,${(0.9-l)*.5})`;x.fillRect(i*T,j*T,T,T)}
    x.fillStyle='rgba(0,0,0,0.35)';x.fillRect(i*T,j*T,T,2);x.fillRect(i*T,j*T,2,T);
    x.fillStyle='rgba(255,255,255,0.05)';x.fillRect(i*T+2,j*T+2,T-2,1);
  }
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return t;
}
// Texture du plafond : assombrie selon le thème de la zone
function ceilTexture(){
  const T=16,c=document.createElement('canvas');c.width=MW*T;c.height=MH*T;const x=c.getContext('2d');
  for(let j=0;j<MH;j++)for(let i=0;i<MW;i++){
    const l=LT[j*MW+i],th=THEMES[TG[j*MW+i]]||THEMES[0];
    x.fillStyle=shade(th.c,.35+((l-.5)*.3));x.fillRect(i*T,j*T,T,T);
    x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(i*T,j*T,T,1);x.fillRect(i*T,j*T,1,T);

}

/**
 * Construit un char 3D complet : châssis, chenilles texturées animables,
 * roues, tourelle orientable et canon. Face avant = -Z.
 */
function buildTank(k){
  const C=TC[k],sc=TSCALE[k];
  const group=new THREE.Group();
  const mats=[]; // pour le flash de dégâts
  const mat=c=>{const m=new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.25});mats.push(m);return m};
  const hullMat=mat(C.h),turretMat=mat(C.t),darkMat=mat(0x1a1a1a),metalMat=mat(0x555555);

  const add=(geo,m,x,y,z,parent)=>{const mesh=new THREE.Mesh(geo,m);mesh.position.set(x,y,z);(parent||group).add(mesh);return mesh};

  // Dimensions selon le type
  const dims={emp:{w:1.5,l:2.6},grunt:{w:1.7,l:3.0},boss:{w:2.3,l:3.8},me:{w:1.6,l:2.8}}[k];

  // Chenilles + roues (des deux côtés)
  const trackTexs=[],wheels=[];
  [-1,1].forEach(side=>{
    const tx=side*(dims.w/2+.25);
    // Roues de chenille
    const wheelGeo=new THREE.CylinderGeometry(.28,.28,.3,12);wheelGeo.rotateZ(Math.PI/2);
    for(let z=-dims.l/2+.3;z<=dims.l/2-.3;z+=.75){
      wheels.push(add(wheelGeo,darkMat,tx,.3,z));
    }
    // Bande de chenille texturée (défilement animé)
    const tTex=trackTexture();tTex.wrapS=tTex.wrapT=THREE.RepeatWrapping;tTex.repeat.set(1,3);trackTexs.push(tTex);
    const trackMat=new THREE.MeshStandardMaterial({map:tTex,roughness:.9});
    mats.push(trackMat);
    add(new THREE.BoxGeometry(.4,.62,dims.l+.3),trackMat,tx,.3,0);
  });

  // Châssis
  add(new THREE.BoxGeometry(dims.w,.7,dims.l),hullMat,0,.75,0);
  // Jupe de blindage avant
  add(new THREE.BoxGeometry(dims.w*.9,.25,.4),mat(C.d),0,.45,-dims.l/2);

  // Tourelle orientable
  const turret=new THREE.Group();turret.position.set(0,1.35,.15);group.add(turret);
  add(new THREE.BoxGeometry(dims.w*.75,.55,dims.l*.6),turretMat,0,.25,0,turret);
  // Canons : Boss = double, joueur = selon l'arme acquise (1 à 3), ennemis = 1
  const nb=k==='boss'?2:(k==='me'?clamp(P.wp,1,3):1),barrels=[];
  for(let i=0;i<nb;i++)barrels.push(-(nb-1)*.24+i*.48);
  barrels.forEach(bx=>{
    const barrel=new THREE.Group();barrel.position.set(bx,.25,0);turret.add(barrel);
    const cyl=new THREE.CylinderGeometry(.09,.09,k==='boss'?1.9:1.6,10);cyl.rotateX(Math.PI/2);cyl.translate(0,0,-(k==='boss'?1.9:1.6)/2);
    add(cyl,metalMat,0,0,0,barrel);
    barrel.userData.restZ=0;
    turret.userData.barrels=(turret.userData.barrels||[]).concat(barrel);
  });

  group.scale.setScalar(sc);
  group.userData={turret,trackTexs,wheels,mats,sc};
  scene.add(group);
  return group;
}

// Orientation : le modèle avance en -Z ; rotation.y pour viser (cos a, sin a)
const yawTo=a=>-a-Math.PI/2;

// Animation des composants du char
function animateTank(m,dt,targetWorldAngle,moving){
  const u=m.el.userData;
  // Chenilles : défilement + rotation des roues
  const spd=moving?m.sp*2.2:0;
  u.trackTexs.forEach(t=>t.offset.y-=spd*dt*.35);
  u.wheels.forEach(w=>w.rotation.x-=spd*dt*1.6);
  // Tourelle vise le joueur
  if(m.aw&&targetWorldAngle!==null){
    const want=targetWorldAngle-m.el.rotation.y;
    const d=(((want-u.turret.rotation.y)%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;
    u.turret.rotation.y+=d*Math.min(1,dt*6);
  }
  // Recul du canon
  (u.turret.userData.barrels||[]).forEach(b=>{b.position.z+=(0-b.position.z)*Math.min(1,dt*8)});
}

// Flash blanc de dégâts
function flashTank(m,on){
  m.el.userData.mats.forEach(mt=>{
    mt.emissive.setHex(on?0xffffff:0x000000);
    mt.emissiveIntensity=on?1:0;
  });
}

// DÉCOR : LABYRINTHE 3D (murs instanciés, sol, plafond)
// ==========================================================================
let levelGroup=null,ceilMesh=null,playerTank=null;

function buildLevel(){
  if(levelGroup){scene.remove(levelGroup);levelGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}})}
  levelGroup=new THREE.Group();scene.add(levelGroup);

  // Murs : regroupés par thème de zone -> un InstancedMesh texturé par thème
  const buckets={},dummy=new THREE.Object3D(),col=new THREE.Color();
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(!M[y*MW+x])continue;
    // Le mur prend le thème de la première cellule ouverte adjacente
    let th=0;
    for(const[dx,dy]of[[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&!M[ny*MW+nx]){th=TG[ny*MW+nx];break}
    }
    const l=LT[Math.min(MW*MH-1,Math.max(0,(y-1)*MW+x))]||.65;
    (buckets[th]=buckets[th]||[]).push({x,y,l});
  }
  const wallGeo=new THREE.BoxGeometry(S,WALL_H,S);
  for(const key in buckets){
    const th=+key,cells=buckets[key];
    const wallMat=new THREE.MeshStandardMaterial({map:themeWallTex(th),roughness:.85,metalness:.15});
    const walls=new THREE.InstancedMesh(wallGeo,wallMat,cells.length);
    cells.forEach((cell,i)=>{
      dummy.position.set((cell.x+.5)*S,WALL_H/2,(cell.y+.5)*S);dummy.updateMatrix();
      walls.setMatrixAt(i,dummy.matrix);
      const lf=clamp(cell.l*rnd(.9,1.05),.35,1.15);
      walls.setColorAt(i,col.setHex(THEMES[th].c).multiplyScalar(lf));
    });
    walls.instanceMatrix.needsUpdate=true;
    if(walls.instanceColor)walls.instanceColor.needsUpdate=true;
    levelGroup.add(walls);
  }

  // Sol
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(MW*S,MH*S),new THREE.MeshStandardMaterial({map:floorTexture(),roughness:.9}));
  floor.rotation.x=-Math.PI/2;floor.position.set(MW*S/2,0,MH*S/2);levelGroup.add(floor);

  // Plafond (masqué en vue détachée)
  ceilMesh=new THREE.Mesh(new THREE.PlaneGeometry(MW*S,MH*S),new THREE.MeshStandardMaterial({map:ceilTexture(),roughness:.9}));
  ceilMesh.rotation.x=Math.PI/2;ceilMesh.position.set(MW*S/2,WALL_H,MH*S/2);levelGroup.add(ceilMesh);

  // Char du joueur (visible en vue détachée / 3e personne) — reconstruit selon l'arme
  rebuildPlayerTank();
}
// Reconstruit le char 3D du joueur (nombre de canons = arme actuelle)
function rebuildPlayerTank(){
  if(playerTank){scene.remove(playerTank);playerTank.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  playerTank=buildTank('me');playerTank.visible=(det||viewMode==='tps');
}

// ==========================================================================
// GÉNÉRATION DU NIVEAU (identique, + construction 3D)
// ==========================================================================
function gen(){
  MW=MH=Math.min(36,22+level*2);M=new Uint8Array(MW*MH);LT=new Float32Array(MW*MH).fill(.65);TG=new Uint8Array(MW*MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)M[y*MW+x]=1+(((x>>2)+(y>>2))%4);
  rooms=[];
  for(let t=0;t<250&&rooms.length<Math.min(9,5+level);t++){
    const w=ri(4,7),h=ri(4,7),x=ri(2,MW-w-2),y=ri(2,MH-h-2);
    if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;
    rooms.push({x,y,w,h});const l=rnd(.75,1.1);
    for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){M[j*MW+i]=0;LT[j*MW+i]=l}
  }
  if(rooms.length<3)return gen();
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1],b=rooms[i],tx=b.x+(b.w>>1),ty=b.y+(b.h>>1);let cx=a.x+(a.w>>1),cy=a.y+(a.h>>1);
    while(cx!==tx){M[cy*MW+cx]=0;cx+=cx<tx?1:-1}while(cy!==ty){M[cy*MW+cx]=0;cy+=cy<ty?1:-1}
  }

  // Attribution d'un thème de décor à chaque chambre (en cycle), couloirs = thème 0
  rooms.forEach((r,i)=>{
    const th=1+(i%(THEMES.length-1));r.th=th;
    for(let j=r.y;j<r.y+r.h;j++)for(let i2=r.x;i2<r.x+r.w;i2++)TG[j*MW+i2]=th;
  });

  buildLevel();

  mons.forEach(m=>m.el&&scene.remove(m.el));
  pk.forEach(p=>p.el&&scene.remove(p.el));
  fb.forEach(f=>f.el&&scene.remove(f.el));
  fx.forEach(e=>e.el&&scene.remove(e.el));
  mons=[];pk=[];fb=[];fx=[];
  const s=rooms[0];let far=rooms[1];
  rooms.forEach(r=>{if((r.x-s.x)**2+(r.y-s.y)**2 > (far.x-s.x)**2+(far.y-s.y)**2)far=r});
  P.x=s.x+s.w/2;P.y=s.y+s.h/2;P.a=rnd(0,6.28);

  rooms.forEach(r=>{
    if(r!==s&&r!==far)for(let n=ri(1,2)+((level-1)>>1);n>0;n--)
      mons.push(mk(Math.random()<Math.min(.8,.3+level*.1)?'grunt':'emp',r.x+rnd(1,r.w-1),r.y+rnd(1,r.h-1)));
    [[.5,.5],[r.w-.5,.5],[.5,r.h-.5],[r.w-.5,r.h-.5]].forEach(([dx,dy])=>addCrate(r.x+dx,r.y+dy));
  });
  boss=mk('boss',far.x+far.w/2,far.y+far.h/2);mons.push(boss);
}

function mk(k,x,y){
  const t=TY[k],lv=level-1,Z=SK[sk],hp=t.hp*(k==='boss'?1+.4*lv:1+.25*lv)*Z.h;
  return{k,x,y,hp,mhp:hp,r:t.r,sp:t.sp*(1+.06*lv)*Z.s,cd:rnd(.5,1.5),aw:0,fl:0,lt:0,sees:false,el:buildTank(k)};
}

const crateMatCache=CRATES.map(cr=>{
  const c=document.createElement('canvas');c.width=c.height=64;
  cr.d(c.getContext('2d'),64);
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;
  return new THREE.MeshStandardMaterial({map:t,emissive:cr.glow,emissiveIntensity:.28,roughness:.45,metalness:.2});
});

function addCrate(x,y){
  const d=ri(0,CRATES.length-1);
  const g=new THREE.Group();
  const core=new THREE.Mesh(new THREE.BoxGeometry(.68,.68,.68),crateMatCache[d]);
  g.add(core);
  // Arêtes néon du cube
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(core.geometry),
    new THREE.LineBasicMaterial({color:CRATES[d].glow,transparent:true,opacity:.85}));
  g.add(edges);
  // Halo au sol
  const halo=mkSprite(fireballTex,1.4);
  halo.material.color.setHex(CRATES[d].glow);halo.material.opacity=.25;
  halo.position.y=-.38;g.add(halo);
  const glow=new THREE.PointLight(CRATES[d].glow,.45,5);glow.position.y=.7;g.add(glow);
  scene.add(g);
  pk.push({x,y,t:rnd(0,6),el:g,d});
}

// ==========================================================================
// RAYCASTING 2D (DDA sur la grille) & COLLISIONS
// ==========================================================================
let hD=0;
function cast(ox,oy,a){
  const dx=Math.cos(a)||1e-9,dy=Math.sin(a)||1e-9,ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),sx=dx<0?-1:1,sy=dy<0?-1:1;
  let mx=Math.floor(ox),my=Math.floor(oy),sdx=(dx<0?ox-mx:mx+1-ox)*ddx,sdy=(dy<0?oy-my:my+1-oy)*ddy;
  for(let i=0;i<80;i++){
    let side=0;if(sdx<sdy){sdx+=ddx;mx+=sx}else{sdy+=ddy;my+=sy;side=1}
    if(mx<0||my<0||mx>=MW||my>=MH)break;
    if(M[my*MW+mx]){hD=side?sdy-ddy:sdx-ddx;return}
  }
  hD=80;
}
const los=(ax,ay,bx,by)=>{cast(ax,ay,Math.atan2(by-ay,bx-ax));return hD>=Math.hypot(bx-ax,by-ay)-.1};
const wall=(x,y)=>{const i=Math.floor(x),j=Math.floor(y);return i<0||j<0||i>=MW||j>=MH||M[j*MW+i]>0};
const blocked=(x,y,r)=>wall(x-r,y-r)||wall(x+r,y-r)||wall(x-r,y+r)||wall(x+r,y+r);
function slide(e,dx,dy,r){if(!blocked(e.x+dx,e.y,r))e.x+=dx;if(!blocked(e.x,e.y+dy,r))e.y+=dy}

// ==========================================================================
// EFFETS : EXPLOSIONS, ÉTINCELLES (sprites Three.js)
// ==========================================================================
function mkSprite(tex,size){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.scale.set(size,size,1);scene.add(s);return s;
}
function boom(x,y,size){
  const el=mkSprite(explosionTex,size);
  el.position.set(x*S,1.6,y*S);
  fx.push({el,x,y,t:0,life:.5,size});
  muzzleLight.position.set(x*S,2.2,y*S);muzzleLight.intensity=3;
  for(let i=0;i<8;i++){
    const sp=mkSprite(sparkTex,.45);
    sp.position.set(x*S,1.2,y*S);
    fx.push({el:sp,x,y,vx:rnd(-3,3),vy:rnd(-3,3),t:0,life:.4,isSpark:true});
  }
}
// Tracer du tir du joueur
function tracer(a,len){
  const g=new THREE.CylinderGeometry(.03,.03,len,6);g.rotateX(Math.PI/2);g.translate(0,0,-len/2);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffee88,transparent:true,opacity:.9}));
  m.position.set(P.x*S,1.7,P.y*S);m.rotation.y=yawTo(a);
  scene.add(m);fx.push({el:m,t:0,life:.08,isTracer:true});
}

// ==========================================================================
// COMBAT / IA / LOOT
// ==========================================================================
const mapC=$('#map'),mg=mapC.getContext('2d'),gunBody=$('#gun-body');
function say(t){$('#toast').textContent=t;toastT=2}

function hurt(d){
  if(P.ar>0){const ab=Math.min(P.ar,d*.5);P.ar-=ab;d-=ab}
  P.hp-=d;flash=.5;vib(40);if(P.hp<=0)die();
}

function hit(m,d){
  if(m.dead)return;m.hp-=d;m.fl=.12;m.aw=1;flashTank(m,true);
  if(m.hp<=0){
    m.dead=1;scene.remove(m.el);score+=m.k==='boss'?1000*level:m.k==='grunt'?150:100;
    if(m.k==='boss'){for(let i=0;i<6;i++)boom(m.x+rnd(-.6,.6),m.y+rnd(-.6,.6),rnd(4,8))}else boom(m.x,m.y,3.5);
    if(Math.random()<.3)addCrate(m.x,m.y);
    if(m.k==='boss'){st='levelup';msgT=3.2;fb.forEach(f=>f.el&&scene.remove(f.el));fb=[];say('BOSS DÉTRUIT ! Niveau '+(level+1))}
  }else boom(m.x,m.y,1.5);
}
let msgT=0;

function shoot(){
  const w=WP[P.wp];if(P.cd>0||P.am<=0)return;
  P.am--;P.cd=w.cd;
  gunBody.classList.add('recoil');
  setTimeout(()=>gunBody.classList.remove('recoil'),90);
  // Flash de bouche 3D + lumière
  muzzleLight.position.set(P.x*S,1.9,P.y*S);muzzleLight.intensity=6;

  for(let i=0;i<w.pel;i++){
    const a=P.a+rnd(-w.sp,w.sp),ca=Math.cos(a),sa=Math.sin(a);cast(P.x,P.y,a);let bd=hD,tgt=null;
    mons.forEach(m=>{const dx=m.x-P.x,dy=m.y-P.y,al=dx*ca+dy*sa;
      if(al<.1||al>bd)return;
      if(Math.abs(-dx*sa+dy*ca)<m.r+.14){bd=al;tgt=m}});
    tracer(a,bd*S);
    if(tgt)hit(tgt,w.dmg*(P.quad>0?3:1));
  }
}

function ball(m,a,sp){
  const dm=SK[sk].d*(1+.15*(level-1));
  const el=mkSprite(fireballTex,.9);
  fb.push({x:m.x,y:m.y,dx:Math.cos(a),dy:Math.sin(a),sp:4.5*sp,d:(m.k==='boss'?15:10)*dm,el});
}

function monsters(dt){
  const dm=SK[sk].d*(1+.15*(level-1));
  mons.forEach(m=>{
    m.fl-=dt;m.cd-=dt;
    if(m.fl<=0&&m.el.userData._f){flashTank(m,false);m.el.userData._f=0}
    if(m.fl>0)m.el.userData._f=1;
    const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy)||.01;
    if((m.lt-=dt)<=0){m.lt=.2;m.sees=los(m.x,m.y,P.x,P.y)}
    if(!m.aw){if(d<9&&m.sees)m.aw=1;else return}
    const go=m.k==='emp'?d>.8:m.k==='grunt'?(d>4||!m.sees):(d>5||!m.sees);
    if(go){const s=m.sp*dt;slide(m,dx/d*s,dy/d*s,m.r)}
    if(m.cd>0)return;
    if(m.k==='emp'){if(d<1){hurt(8*dm);m.cd=.9}else if(m.sees&&d<9){if(Math.random()<.45)hurt(5*dm);m.cd=1.1}}
    else if(m.sees&&d<14){
      if(m.k==='grunt'){ball(m,Math.atan2(dy,dx),1);m.cd=rnd(1.4,2.2)/Math.sqrt(dm)}
      else{const ph=m.hp<m.mhp*.33?3:m.hp<m.mhp*.66?2:1;
        for(let i=-ph;i<=ph;i++)ball(m,Math.atan2(dy,dx)+i*.16,1.3);m.cd=Math.max(.6,1.3-.2*ph)}
    }
  });
  mons=mons.filter(m=>!m.dead);
  fb.forEach(f=>{f.x+=f.dx*f.sp*dt;f.y+=f.dy*f.sp*dt;
    if(wall(f.x,f.y)){f.dead=1;boom(f.x,f.y,1.2)}
    else if(Math.hypot(f.x-P.x,f.y-P.y)<.4){hurt(f.d);f.dead=1}
    if(f.dead&&f.el)scene.remove(f.el);
    if(f.el)f.el.position.set(f.x*S,1.5,f.y*S);
  });
  fb=fb.filter(f=>!f.dead);
}

// Feedback visuel sur les barres de vitaux au ramassage
function barFx(id){const b=$(id);if(!b)return;b.classList.remove('fx');void b.offsetWidth;b.classList.add('fx')}

function loot(){
  const k=LOOT[ri(0,LOOT.length-1)];score+=25;
  if(k==='H'){P.hp=Math.min(100,P.hp+30);say('Réparations +30');barFx('#hpbar')}
  else if(k==='A'){P.am=Math.min(200,P.am+25);say('Obus +25')}
  else if(k==='R'){P.ar=Math.min(100,P.ar+50);say('Blindage +50');barFx('#arbar')}
  else if(k==='W'){if(P.wp<3){P.wp++;P.am+=20;rebuildPlayerTank();say(P.wp===2?'CANON DOUBLE !':'CANON TRIPLE !')}else{P.am+=40;say('Obus +40')}}
  else if(k==='Q'){P.quad=12;say('Puissance x3 !')}
  else if(k==='B'){mons.forEach(m=>hit(m,m.k==='boss'?60:90));flash=.8;say('BOMBE INTÉGRALE !')}
  else{say('PIÈGE !');for(let n=0;n<3;n++)for(let t=0;t<20;t++){
    const a=rnd(0,6.28),r=rnd(1.5,3),x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r;
    if(!blocked(x,y,.3)){const m=mk(Math.random()<.5?'grunt':'emp',x,y);m.aw=1;mons.push(m);break}}}
}

function upd(dt){
  time+=dt;P.cd-=dt;P.quad-=dt;flash=Math.max(0,flash-dt*2);toastT-=dt;
  P.a+=((K.arrowright?1:0)-(K.arrowleft?1:0))*2.3*dt;
  const f=clamp(((K.z||K.w||K.arrowup)?1:0)-((K.s||K.arrowdown)?1:0)-stick.y,-1,1);
  const sd=clamp((K.d?1:0)-((K.q||K.a)?1:0)+stick.x,-1,1),sp=3.2*dt;
  slide(P,(Math.cos(P.a)*f-Math.sin(P.a)*sd)*sp,(Math.sin(P.a)*f+Math.cos(P.a)*sd)*sp,.25);
  if(f||sd)P.bob+=dt*10;
  if(firing||K[' ']||K.control)shoot();
  if(st==='levelup'){msgT-=dt;if(msgT<=0){level++;P.hp=Math.min(100,P.hp+25);P.am+=20;gen();st='play'}return}
  pk.forEach(p=>{if(Math.hypot(p.x-P.x,p.y-P.y)<.55){p.d=1;scene.remove(p.el);loot()}});
  pk=pk.filter(p=>!p.d);
  monsters(dt);
}

// ==========================================================================
// RENDU : CAMÉRA + MISE À JOUR DES MESHES
// ==========================================================================
function render(dt){
  const X=P.x*S,Z=P.y*S;
  if(det){
    // Vue tactique détachée : caméra au-dessus du joueur, tourne avec lui
    camera.position.set(X,dist,Z);
    camera.rotation.set(-Math.PI/2,0,0);
    camera.lookAt(X,0,Z+0.001);
    camera.rotateZ(-(yawTo(P.a)+Math.PI));
    ceilMesh&&(ceilMesh.visible=false);
    playerTank.visible=true;
    playerTank.position.set(X,0,Z);
    playerTank.rotation.y=yawTo(P.a);
    animateTank({el:playerTank,sp:3.2,aw:true},dt,null,0);
  }else if(viewMode==='tps'){
    // Vue 3e personne : caméra de poursuite derrière/au-dessus du char joueur
    const fx=Math.cos(P.a),fz=Math.sin(P.a);
    camera.position.set(X-fx*7.5,4.4+Math.sin(P.bob)*.15,Z-fz*7.5);
    camera.lookAt(X+fx*4,1.2,Z+fz*4);
    ceilMesh&&(ceilMesh.visible=true);
    playerTank.visible=true;
    playerTank.position.set(X,0,Z);
    playerTank.rotation.y=yawTo(P.a);
    // Tourelle alignée sur la visée, chenilles animées en roulant
    animateTank({el:playerTank,sp:3.2,aw:true},dt,P.a,1);
  }else{
    // Vue subjective : bob de marche + orientation
    camera.position.set(X,1.7+Math.sin(P.bob)*.06,Z);
    camera.rotation.set(0,yawTo(P.a),0);
    ceilMesh&&(ceilMesh.visible=true);
    playerTank.visible=false;
  }

  // Ennemis
  mons.forEach(m=>{
    const ang=Math.atan2(P.y-m.y,P.x-m.x);
    m.el.position.set(m.x*S,0,m.y*S);
    m.el.rotation.y=yawTo(ang);
    animateTank(m,dt,m.aw?ang:null,1);
  });

  // Caisses
  pk.forEach(c=>{
    c.el.position.set(c.x*S,.9+Math.sin(time*3+c.t)*.2,c.y*S);
    c.el.rotation.y=time*1.5+c.t;
  });

  // Effets
  muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*30);
  fx.forEach(e=>{
    e.t+=dt;
    if(e.isSpark){
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.el.position.set(e.x*S,1.2,e.y*S);
      const s=Math.max(.01,1-e.t/e.life);e.el.scale.set(.45*s,.45*s,1);
      e.el.material.opacity=s;
    }else if(e.isTracer){
      e.el.material.opacity=Math.max(0,.9*(1-e.t/e.life));
    }else{
      const p=e.t/e.life;
      e.el.scale.set(e.size*(1+2.5*p),e.size*(1+2.5*p),1);
      e.el.material.opacity=1-p;
    }
  });
  fx=fx.filter(e=>{if(e.t<=e.life)return true;scene.remove(e.el);if(e.el.material&&e.el.material.dispose&&e.isTracer)e.el.material.dispose();return false});

  $('#flash').style.opacity=flash;$('#toast').style.opacity=clamp(toastT*2,0,1);
  // Vitaux : barre de PV (couleur selon l'état) + armure + arme affichée en jeu
  const hpw=clamp(P.hp,0,100);
  $('#hpfill').style.width=hpw+'%';
  $('#hpfill').style.background=P.hp>60?'linear-gradient(90deg,#22cc44,#88ee44)':P.hp>30?'linear-gradient(90deg,#ccaa22,#ffee44)':'linear-gradient(90deg,#cc1111,#ff6600)';
  $('#arfill').style.width=clamp(P.ar,0,100)+'%';
  document.body.classList.toggle('wp2',P.wp===2);
  document.body.classList.toggle('wp3',P.wp===3);
  if((hudT-=dt)<=0){hudT=.1;
    $('#hl').textContent='PV '+Math.max(0,P.hp|0)+'\nARMURE '+(P.ar|0)+'\nOBUS '+P.am+(P.quad>0?'\nX3 '+Math.ceil(P.quad):'');
    $('#hptxt').textContent=Math.max(0,P.hp|0);
    $('#artxt').textContent=P.ar|0;
    $('#wptxt').textContent='x'+P.wp;
    $('#hr').textContent='NIVEAU '+level+'\nSCORE '+score;
    $('#bossbar').style.display=boss&&boss.aw&&!boss.dead?'block':'none';$('#bb').style.width=Math.max(0,boss.hp/boss.mhp*100)+'%';
  }
  drawMap();
  renderer.render(scene,camera);
}

// ==========================================================================
// MINI-CARTE 2D (inchangée)
// ==========================================================================
function drawMap(){
  if(!mapMode){mapC.style.display='none';return}
  mapC.style.display='block';mapC.className=mapMode===2?'big':'';
  const vc=follow?22:MW,size=mapMode===2?Math.floor(Math.min(innerWidth,innerHeight)*.8):120,cell=size/vc;
  if(mapC.width!==size){mapC.width=mapC.height=size}
  const ox=follow?P.x-vc/2:0,oy=follow?P.y-vc/2:0,px=v=>(v-ox)*cell,py=v=>(v-oy)*cell;
  mg.fillStyle='#000';mg.fillRect(0,0,size,size);mg.fillStyle='#3a4a58';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(!M[y*MW+x])mg.fillRect(px(x),py(y),cell+.6,cell+.6);
  mg.fillStyle='#ffcc00';pk.forEach(c=>mg.fillRect(px(c.x)-1,py(c.y)-1,3,3));
  mg.fillStyle='#ff4d2d';mons.forEach(m=>{const s=m.k==='boss'?8:5;mg.fillRect(px(m.x)-s/2,py(m.y)-s/2,s,s)});
  mg.fillStyle='#00ffcc';mg.fillRect(px(P.x)-2,py(P.y)-2,4,4);mg.strokeStyle='#00ffcc';mg.beginPath();mg.moveTo(px(P.x),py(P.y));mg.lineTo(px(P.x)+Math.cos(P.a)*10,py(P.y)+Math.sin(P.a)*10);mg.stroke();
}

// ==========================================================================
// MENUS, ÉVÉNEMENTS, BOUCLE
// ==========================================================================
function showMenu(t,s,b){$('#menu h1').textContent=t;$('#menu p').textContent=s;$('#go').textContent=b;$('#menu').style.display='flex'}
function lockMouse(){if(!coarse&&document.body.requestPointerLock){try{const r=document.body.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
function newGame(){level=1;score=0;Object.assign(P,{hp:100,ar:0,am:50,wp:1,quad:0});gen();st='play';$('#menu').style.display='none';lockMouse();say('Traquez le Boss Tank !')}
function die(){
  st='dead';firing=false;if(score>best){best=score;try{localStorage.setItem('bunkert-best',best)}catch(e){}}
  if(document.exitPointerLock)document.exitPointerLock();
  showMenu('CHAR DÉTRUIT','Niveau '+level+' · Score '+score+' · Record '+best,'REJOUER');
}
function pause(){if(st==='play'){st='paused';showMenu('PAUSE','Difficulté : '+SK[sk].n,'REPRENDRE')}}

const skBox=$('#sk');
SK.forEach((z,i)=>{const b=document.createElement('button');b.textContent=z.n;b.onclick=()=>{sk=i;try{localStorage.setItem('bunkert-sk',i)}catch(e){}[...skBox.children].forEach((c,j)=>c.classList.toggle('on',j===i))};skBox.appendChild(b)});
skBox.children[sk].classList.add('on');
$('#go').addEventListener('click',()=>{if(st==='paused'){st='play';$('#menu').style.display='none';lockMouse()}else newGame()});

const tools={
  map:()=>{mapMode=(mapMode+1)%3},fol:()=>{follow=!follow},
  cam:()=>{det=!det;document.body.classList.toggle('det',det);viewMode='fps';document.body.classList.remove('tps')},
  view:()=>{if(det){det=false;document.body.classList.remove('det')}viewMode=viewMode==='fps'?'tps':'fps';document.body.classList.toggle('tps',viewMode==='tps')},
  zoom:()=>{dist=dist>30?26:80},
  fs:()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})},
  in:()=>{dist=clamp(dist-8,14,140)},out:()=>{dist=clamp(dist+8,14,140)}
};
$('#tools').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(a)tools[a]()});
const KEYS={m:'map',n:'fol',v:'cam',c:'view',b:'zoom',f:'fs','+':'in','=':'in','-':'out'};

document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement)pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('blur',()=>{K={};firing=false;pause()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  K[k]=1;if(k==='p'||k==='escape')pause();if(KEYS[k]&&!e.repeat)tools[KEYS[k]]()});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

// Souris + tactile
const tz=$('#tz'),stk=$('#stick'),knob=$('#knob');
tz.addEventListener('pointerdown',e=>{
  if(st!=='play')return;e.preventDefault();
  if(e.pointerType==='mouse'){firing=true;mdown=true;lx=e.clientX;return}
  if(e.clientX<innerWidth/2&&stick.id===null){
    stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:0,y:0};stk.style.display='block';stk.style.left=e.clientX+'px';stk.style.top=e.clientY+'px';knob.style.transform='';
  }else if(look.id===null)look={id:e.pointerId,lx:e.clientX};
});
tz.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){
    if(document.pointerLockElement)P.a+=e.movementX*.0025;else if(mdown){P.a+=(e.clientX-lx)*.004;lx=e.clientX}
  }else if(e.pointerId===stick.id){
    stick.x=clamp((e.clientX-stick.ox)/50,-1,1);stick.y=clamp((e.clientY-stick.oy)/50,-1,1);
    knob.style.transform='translate('+stick.x*30+'px,'+stick.y*30+'px)';
  }else if(look.id===null?false:e.pointerId===look.id){P.a+=(e.clientX-look.lx)*.006;look.lx=e.clientX}
});
const up=e=>{
  if(e.pointerType==='mouse'){firing=false;mdown=false}
  if(e.pointerId===stick.id){stick={id:null,ox:0,oy:0,x:0,y:0};stk.style.display='none'}
  if(e.pointerId===look.id)look={id:null,lx:0};
};
['pointerup','pointercancel'].forEach(ev=>tz.addEventListener(ev,up));
const fireB=$('#fire');
fireB.addEventListener('pointerdown',e=>{e.preventDefault();firing=true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>fireB.addEventListener(ev,()=>{firing=false}));
tz.addEventListener('contextmenu',e=>e.preventDefault());

// INIT + BOUCLE
gen();showMenu('BUNKER TANKS 3D','Détruisez le char BOSS pour passer au niveau suivant. Rendu WebGL Three.js !','JOUER');
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(st==='play'||st==='levelup')upd(dt);else if(st==='title')P.a+=dt*.25;
  render(dt);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
